name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: test
        run: npx vitest run
      # The runner is UTC and most developers are not. A suite that passes only
      # in the timezone it was written in is a suite that goes red for the first
      # contributor in another one, and the cause is invisible from the failure.
      # 25 hours of spread: +14, UTC, and -11. This is cheap -- the suite is
      # under two seconds -- and it is the check that lets the security policy
      # claim determinism without the claim rotting.
      - name: the suite is timezone-independent
        run: |
          for tz in Pacific/Kiritimati Pacific/Niue; do
            echo "--- TZ=$tz"
            TZ=$tz npx vitest run
          done
      # The suite tests the repository. This tests the ARTIFACT -- the tarball a
      # consumer actually installs -- which is a different thing and fails in
      # different ways: a `files` entry that drops a directory, an `exports` map
      # that points at something not shipped, a type declaration left behind.
      # None of those can fail a test run inside the repo, where every file is
      # present whether it ships or not.
      #
      # It also re-checks a claim the README makes in prose. The README states
      # that `npm install latch-engine && npx tsx example.ts` prints a specific
      # line. Prose cannot fail on its own, so the claim is asserted here and the
      # README becomes wrong loudly rather than quietly.
      - name: the published tarball installs and runs
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm i ./latch-engine-*.tgz >/dev/null
          npm i -D tsx >/dev/null
          # Quoted heredoc: the assertion below contains ${...} template
          # literals, and an unquoted one lets the shell eat them.
          cat > smoke.ts <<'SMOKE'
          import { matchNameservers } from "latch-engine";
          const got = matchNameservers(["aida.ns.cloudflare.com"]);
          const want = { id: "cloudflare", displayName: "Cloudflare", treatment: "cloudflare" };
          const a = JSON.stringify(got), b = JSON.stringify(want);
          if (a !== b) throw new Error(`README claims ${b}, published package gives ${a}`);
          console.log("published package resolves and computes:", a);
          SMOKE
          npx tsx smoke.ts
          # And the tarball must not ship tests.
          if tar tzf ./latch-engine-*.tgz | grep -q 'test\.ts'; then
            echo "the tarball ships test files"; exit 1
          fi
          echo "tarball carries no test files"
      - name: the mutation runner's own suite
        run: npm run test:mutation-runner
      - name: mutation
        run: npm run mutation
